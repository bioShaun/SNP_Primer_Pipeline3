name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check src/ tests/

      - name: Mypy
        run: |
          source .venv/bin/activate
          mypy src/snp_primer_pipeline/

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -m "not manual" --strict-markers -v -o "addopts=--strict-markers" 2>&1 | tee pytest-output.txt

      - name: Check skipped count threshold
        if: always()
        run: |
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | grep -oP '^\d+' || echo "0")
          echo "Skipped tests: $skipped"
          if [ "$skipped" -gt 40 ]; then
            echo "::error::Too many tests skipped ($skipped > 40). Investigate silent skips."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest -m "not manual" --strict-markers -v \
            --cov=snp_primer_pipeline --cov-report=html --cov-report=term-missing \
            -o "addopts=--strict-markers"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
